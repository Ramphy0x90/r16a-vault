[package]
name = "vector-verify"
version = "0.1.0"
edition = "2024"
publish = false
description = "Recomputes shared/crypto-test-vectors.json with RustCrypto, independently of libsodium"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
hex = "0.4.3"
serde_json = "1"
unicode-normalization = "0.1.26"
