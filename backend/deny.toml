# Supply chain policy checked with `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack on RSA private key operations in the rsa crate, pulled in by openidconnect.
  # The server only verifies provider signatures with public keys and never holds an RSA
  # private key, so the vulnerable code path is unreachable. Revisit when rsa 0.10 ships.
  { id = "RUSTSEC-2023-0071", reason = "only RSA public key verification is used" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# OpenSSL is kept out so the musl static build stays simple and rustls is the only TLS stack.
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
