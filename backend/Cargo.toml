[package]
name = "r16a-vault-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] }
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
getrandom = { version = "0.4.3", features = ["std"] }
hmac = "0.13.0"
http = "1.5.0"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
ipnet = "2.12.2"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "derive"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "set-header", "request-id", "catch-panic", "sensitive-headers", "util"] }
governor = "0.10.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
zeroize = "1.9.1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
