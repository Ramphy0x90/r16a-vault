# Runs unprivileged with a read only root filesystem. Every writable path is under /tmp,
# which the container runtime mounts as tmpfs or emptyDir.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/wasm wasm;
  }

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Client addresses are personal data, so access logs keep only the network, an IPv4 /24 or
  # an IPv6 /48, which is enough to spot abuse. User agents are not logged at all. Bodies,
  # query strings, cookies and auth headers never are.
  map $remote_addr $client_network {
    ~^(?P<net>\d+\.\d+\.\d+)\.\d+$ $net.0;
    ~^(?P<net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $net::;
    default unknown;
  }
  log_format main '$client_network "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/wasm;
  gzip_min_length 1024;

  include /etc/nginx/conf.d/*.conf;
}
