include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
