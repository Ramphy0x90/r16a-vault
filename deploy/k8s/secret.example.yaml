# Copy to secret.yaml (git ignored), fill in, then: kubectl apply -f secret.yaml
# Generate the two keys with: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: r16a-vault-secret
  namespace: r16a-vault
type: Opaque
stringData:
  # Runtime role, can only read and write rows.
  DATABASE_URL: "postgres://r16a_vault_app:CHANGE_ME@postgres.r16a-databases.svc.cluster.local:5432/r16a_vault"
  # Schema owner, used only by the migrate init container, never by the server itself.
  MIGRATE_DATABASE_URL: "postgres://r16a_vault_owner:CHANGE_ME@postgres.r16a-databases.svc.cluster.local:5432/r16a_vault"
  PRELOGIN_SECRET: "CHANGE_ME"
  # Never change this one after the first start, every stored login would stop working.
  AUTH_PEPPER: "CHANGE_ME"
