# Pod Security Admission enforces the restricted profile, so a manifest that drops any of
# the hardening below is rejected by the API server instead of silently running.
apiVersion: v1
kind: Namespace
metadata:
  name: r16a-vault
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
