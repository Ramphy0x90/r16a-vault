# One host, same origin. /api goes straight to the backend, everything else to the web app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r16a-vault
  namespace: r16a-vault
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zaltys.app
      secretName: r16a-vault-tls
  rules:
    - host: zaltys.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: r16a-vault-backend
                port:
                  number: 8081
          - path: /
            pathType: Prefix
            backend:
              service:
                name: r16a-vault-web
                port:
                  number: 8080
