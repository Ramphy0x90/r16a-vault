# Static web app on unprivileged nginx, user 101. The root filesystem is read only, the
# rendered site config and nginx temp files live on emptyDir volumes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r16a-web
  namespace: r16a-vault
  labels:
    app.kubernetes.io/name: r16a-web
    app.kubernetes.io/part-of: r16a-vault
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: r16a-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: r16a-web
        app.kubernetes.io/part-of: r16a-vault
    spec:
      serviceAccountName: r16a-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.internal/r16a-vault-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: R16A_BACKEND_UPSTREAM
              value: "r16a-backend:8081"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: r16a-web
  namespace: r16a-vault
  labels:
    app.kubernetes.io/name: r16a-web
spec:
  selector:
    app.kubernetes.io/name: r16a-web
  ports:
    - name: http
      port: 8080
      targetPort: http
