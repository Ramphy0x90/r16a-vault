apiVersion: apps/v1
kind: Deployment
metadata:
  name: r16a-vault-web
  namespace: r16a-vault
  labels:
    app: r16a-vault-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: r16a-vault-web
  template:
    metadata:
      labels:
        app: r16a-vault-web
    spec:
      imagePullSecrets:
        - name: registry-r16a-vault
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: r16a-vault-web
          image: registry.r16a.cloud/r16a-vault-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: R16A_BACKEND_UPSTREAM
              value: r16a-vault-backend:8081
            # Domain association for the mobile sign in link. Until these are filled in, phones
            # refuse to hand the link to the app and mobile single sign on fails safely.
            # Android, SHA-256 of the release signing key (Play Console, App signing), quoted and comma separated.
            - name: R16A_ANDROID_CERT_FINGERPRINTS
              value: ""
            # iOS, "<TeamID>.<bundle id>", quoted and comma separated.
            - name: R16A_APPLE_APP_IDS
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          # nginx writes its rendered config and temp files here, the rest stays read only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: r16a-vault-web
  namespace: r16a-vault
spec:
  type: ClusterIP
  selector:
    app: r16a-vault-web
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
