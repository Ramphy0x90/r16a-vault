# Non secret settings only. Passwords, keys and database URLs live in the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: r16a-backend-config
  namespace: r16a-vault
data:
  R16A_BIND: "0.0.0.0:8081"
  R16A_PUBLIC_URL: "https://vault.example.com"
  R16A_DEV_INSECURE_COOKIE: "false"
  R16A_REGISTRATION_ENABLED: "true"
  # Peers allowed to set X-Forwarded-For. Ideally only Traefik's pod range (for example a
  # dedicated Calico IP pool for the traefik namespace). Trusting the whole pod network is safe
  # only because networkpolicy.yaml lets nothing but Traefik and the web pods reach the
  # backend, which in turn requires a CNI that enforces NetworkPolicy (Calico, Cilium).
  # Flannel silently ignores NetworkPolicy, see README.md in this folder.
  R16A_TRUSTED_PROXY_CIDRS: "10.244.0.0/16"
  R16A_SESSION_IDLE_SECS: "1800"
  R16A_SESSION_ABSOLUTE_SECS: "43200"
  R16A_DB_MAX_CONNECTIONS: "10"
  RUST_LOG: "info,sqlx=warn"
  # Single sign on stays off until the secret carries a client id and secret.
  R16A_OIDC_ENABLED: "false"
  R16A_OIDC_ISSUER_URL: "https://auth.example.com/application/o/r16a-vault/"
  R16A_OIDC_DISPLAY_NAME: "Authentik"
---
# CA certificate that signed the PostgreSQL server certificate, used for sslmode=verify-full.
# Public data, so a ConfigMap is fine. Replace the placeholder with the real PEM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: r16a-db-ca
  namespace: r16a-vault
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_THE_POSTGRES_CA_CERTIFICATE
    -----END CERTIFICATE-----
