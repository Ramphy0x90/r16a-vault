# Template only. Copy to secret.dec.yaml (ignored by git), fill in the values, then encrypt
#   sops --encrypt secret.dec.yaml > secret.enc.yaml
# with the age recipient in .sops.yaml, delete secret.dec.yaml and commit secret.enc.yaml.
#
# The database URLs point at the existing PostgreSQL instance prepared by provision.sql.
# Generate keys with `openssl rand -base64 48`.
apiVersion: v1
kind: Secret
metadata:
  name: r16a-backend-secrets
  namespace: r16a-vault
type: Opaque
stringData:
  R16A_DATABASE_URL: "postgres://r16a_app:REPLACE_APP_PASSWORD@postgres.example.internal:5432/r16a?sslmode=require"
  R16A_MIGRATE_DATABASE_URL: "postgres://r16a_owner:REPLACE_OWNER_PASSWORD@postgres.example.internal:5432/r16a?sslmode=require"
  R16A_PRELOGIN_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  # Optional but recommended. Changing it later invalidates every stored login hash.
  R16A_AUTH_PEPPER: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  R16A_OIDC_CLIENT_ID: "REPLACE_IF_OIDC_ENABLED"
  R16A_OIDC_CLIENT_SECRET: "REPLACE_IF_OIDC_ENABLED"
