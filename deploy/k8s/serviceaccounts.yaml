# Dedicated identities with no API token mounted. None of the workloads talk to the
# Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r16a-backend
  namespace: r16a-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r16a-web
  namespace: r16a-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r16a-migrate
  namespace: r16a-vault
automountServiceAccountToken: false
